<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pyro Electronics - Refurbished laptops, enterprise networking, and quality hardware.">
  <title>Pyro Electronics - Template</title>
  <link rel="stylesheet" href="Pyro.css">
</head>
<body>

  <!-- Site Header -->
  <header>
    <div class="logo">
      <h1>Pyro <span>Electronics</span></h1>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="store.html">Store</a>
      <a href="contact.html">Contact</a>
      <a href="https://www.ebay.com/str/pyroelectronicsnj" target="_blank" class="ebay-link">Cart</a>
    </nav>
  </header>

  <!-- Hero / Banner Section -->
  <section class="hero">
    <h2>Contact Us</h2>
    <p>Subtitle or brief section overview description goes here.</p>
  </section>

  <!-- Main Blank Section -->
  <main id="content">
    
   <section id="contact" class="contact-section">
    <form class="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message / Sourcing Request</label>
      <textarea id="message" name="message" rows="4" required></textarea>

      <button type="submit" class="btn">Submit Request</button>
    </form>
  </section>

  </main>

  <!-- Site Footer -->
  <footer>
    <p>&copy; 2026 Pyro Electronics NJ. All rights reserved.</p>
  </footer>

</body>
</html>
